<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Tracker</title>
  </head>
  <body>
    <!--
      CONTRATO COMÚN: los id y name de este archivo los usan Persona A y Persona B.
      No cambiarlos sin avisar al compañero (ver CLAUDE.md).
    -->
    <main class="card">
      <header>
        <h1>Budget Tracker</h1>
        <p class="subtitle">Apunta tus gastos y controla cuánto llevas gastado.</p>
      </header>

      <form id="expense-form" novalidate>
        <label class="field">
          <span>Gasto</span>
          <input type="text" name="expense-name" placeholder="Ej.: Café" autocomplete="off" />
        </label>
        <label class="field">
          <span>Importe (€)</span>
          <input type="number" name="expense-amount" step="0.01" placeholder="Ej.: 2.50" />
        </label>
        <button type="submit">Añadir</button>
      </form>

      <p id="error" role="alert"></p>

      <section class="expenses">
        <h2>Gastos</h2>
        <ul id="expense-list"></ul>
      </section>

      <p class="total">Total gastado: <span id="total">0.00</span> €</p>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
